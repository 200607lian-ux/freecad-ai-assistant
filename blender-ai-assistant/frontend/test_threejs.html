<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 快速测试</title>
    <style>
        body {
            font-family: 'Consolas', monospace;
            background: #1a1a2e;
            color: #e2e8f0;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #ff8c42;
        }
        .result {
            background: #16213e;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
            border-left: 4px solid #ff8c42;
        }
        .success {
            border-left-color: #10b981;
            color: #10b981;
        }
        .error {
            border-left-color: #ef4444;
            color: #ef4444;
        }
        #canvas {
            width: 100%;
            height: 400px;
            background: #0d1117;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <h1>🧪 Three.js 快速测试</h1>
    
    <div id="results"></div>
    
    <h2>3D 渲染测试</h2>
    <canvas id="canvas"></canvas>
    
    <!-- Three.js 库 - r128 版本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, isSuccess) {
            const div = document.createElement('div');
            div.className = 'result ' + (isSuccess ? 'success' : 'error');
            div.textContent = (isSuccess ? '✓ ' : '✗ ') + message;
            results.appendChild(div);
        }
        
        // 测试 1：检查 Three.js 核心库
        if (typeof THREE !== 'undefined') {
            addResult('Three.js 核心库已加载 (版本: ' + THREE.REVISION + ')', true);
        } else {
            addResult('Three.js 核心库未加载', false);
        }
        
        // 测试 2：检查 STLLoader
        if (typeof THREE !== 'undefined' && THREE.STLLoader) {
            addResult('STLLoader 已加载', true);
        } else {
            addResult('STLLoader 未加载', false);
        }
        
        // 测试 3：检查 OrbitControls
        if (typeof THREE !== 'undefined' && THREE.OrbitControls) {
            addResult('OrbitControls 已加载', true);
        } else {
            addResult('OrbitControls 未加载', false);
        }
        
        // 测试 4：创建 3D 场景
        try {
            const canvas = document.getElementById('canvas');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d1117);
            
            const camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
            camera.position.set(3, 3, 3);
            camera.lookAt(0, 0, 0);
            
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // 添加灯光
            const light1 = new THREE.DirectionalLight(0xffffff, 1);
            light1.position.set(5, 5, 5);
            scene.add(light1);
            
            const light2 = new THREE.AmbientLight(0x404040);
            scene.add(light2);
            
            // 添加立方体
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0xff8c42 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            // 添加网格地面
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // 渲染循环
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                controls.update();
                renderer.render(scene, camera);
            }
            
            animate();
            
            addResult('3D 场景创建成功并开始渲染', true);
            addResult('你应该看到一个旋转的橙色立方体', true);
            
        } catch (error) {
            addResult('3D 场景创建失败: ' + error.message, false);
        }
        
        // 测试 5：测试 STL 加载
        try {
            // 创建一个简单的三角形 STL（Base64 编码）
            const testSTL = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAANszMPgAAAAAAAIA/AACAPwAAgD8AAAAAAACAPwAAgD8AAIA/AACAPw==";
            
            const binaryString = atob(testSTL);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            const loader = new THREE.STLLoader();
            const geometry = loader.parse(bytes.buffer);
            
            addResult('STL 加载功能正常 (测试数据: ' + geometry.attributes.position.count + ' 顶点)', true);
            
        } catch (error) {
            addResult('STL 加载失败: ' + error.message, false);
        }
    </script>
</body>
</html>
