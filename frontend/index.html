<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeCAD AI 助手</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧聊天区域 */
        .chat-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        
        .chat-header {
            padding: 15px 20px;
            background: #16213e;
            border-bottom: 1px solid #333;
        }
        
        .chat-header h1 {
            font-size: 1.2em;
            color: #00d4ff;
        }
        
        .status-bar {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.8em;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        
        .status-dot.disconnected {
            background: #ff4444;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        
        .message.user {
            align-self: flex-end;
            background: #0f3460;
            border-bottom-right-radius: 4px;
        }
        
        .message.ai {
            align-self: flex-start;
            background: #16213e;
            border-bottom-left-radius: 4px;
        }
        
        .message.system {
            align-self: center;
            background: #333;
            font-size: 0.85em;
            color: #aaa;
        }
        
        .message.error {
            align-self: center;
            background: #442222;
            color: #ff8888;
        }
        
        .message-header {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 5px;
        }
        
        .code-block {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        
        .code-block pre {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85em;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .chat-input-area {
            padding: 15px 20px;
            background: #16213e;
            border-top: 1px solid #333;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f3460;
            color: #eee;
            font-size: 1em;
            outline: none;
        }
        
        #messageInput:focus {
            border-color: #00d4ff;
        }
        
        #sendBtn {
            padding: 12px 24px;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        #sendBtn:hover {
            background: #00a8cc;
            transform: translateY(-1px);
        }
        
        #sendBtn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .quick-btn {
            padding: 6px 12px;
            background: #0f3460;
            border: 1px solid #333;
            border-radius: 16px;
            color: #aaa;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #1a5490;
            color: #fff;
        }
        
        /* 右侧预览区域 */
        .preview-panel {
            width: 55%;
            display: flex;
            flex-direction: column;
        }
        
        .preview-header {
            padding: 15px 20px;
            background: #16213e;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .preview-header h2 {
            font-size: 1.1em;
            color: #00d4ff;
        }
        
        .preview-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .export-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .export-select {
            padding: 6px 10px;
            background: #0f3460;
            border: 1px solid #333;
            border-radius: 6px;
            color: #eee;
            font-size: 0.85em;
            cursor: pointer;
            outline: none;
        }
        
        .export-select:focus {
            border-color: #00d4ff;
        }
        
        .export-btn {
            padding: 6px 14px;
            background: #00d4ff;
            border: none;
            border-radius: 6px;
            color: #1a1a2e;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            background: #00a8cc;
            transform: translateY(-1px);
        }
        
        .export-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-btn {
            padding: 6px 14px;
            background: #0f3460;
            border: 1px solid #333;
            border-radius: 6px;
            color: #eee;
            cursor: pointer;
            font-size: 0.85em;
        }
        
        .preview-btn:hover {
            background: #1a5490;
        }
        
        .preview-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
        }
        
        .screenshot-container {
            flex: 1;
            background: #0d1117;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            position: relative;
        }
        
        .screenshot-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }
        
        .screenshot-placeholder {
            color: #666;
            font-size: 1.1em;
        }
        
        .scene-info {
            background: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .scene-info h3 {
            font-size: 0.9em;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .object-list {
            font-size: 0.85em;
            line-height: 1.8;
        }
        
        .object-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* 截图加载遮罩 */
        .screenshot-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 12px;
            z-index: 10;
        }
        
        .screenshot-loading p {
            color: #00d4ff;
            font-size: 0.9em;
            margin: 0;
        }
        
        /* 3D 查看器样式 */
        .model-viewer-container {
            flex: 1;
            background: #0d1117;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }
        
        .model-viewer-container canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        
        .viewer-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.1em;
            z-index: 1;
        }
        
        .viewer-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            z-index: 5;
            background: rgba(13, 17, 23, 0.8);
            padding: 8px;
            border-radius: 8px;
            display: none;
        }
        
        .viewer-controls.show {
            display: flex;
        }
        
        .viewer-btn {
            padding: 4px 12px;
            background: #0f3460;
            border: 1px solid #333;
            border-radius: 4px;
            color: #eee;
            cursor: pointer;
            font-size: 0.8em;
        }
        
        .viewer-btn:hover {
            background: #1a5490;
        }
        
        .viewer-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 12px;
            z-index: 10;
        }
        
        .viewer-loading p {
            color: #00d4ff;
            font-size: 0.9em;
            margin: 0;
        }
        
        /* 按钮禁用状态 */
        .preview-btn:disabled,
        .export-btn:disabled {
            background: #555 !important;
            cursor: not-allowed !important;
            transform: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧聊天面板 -->
        <div class="chat-panel">
            <div class="chat-header">
                <h1>FreeCAD AI 助手</h1>
                <div class="status-bar">
                    <div class="status-item">
                        <div class="status-dot" id="wsStatus"></div>
                        <span>WebSocket</span>
                        <span id="wsDetail" style="color: #666; font-size: 0.75em; margin-left: 5px;"></span>
                    </div>
                    <div class="status-item">
                        <div class="status-dot" id="fcStatus"></div>
                        <span>FreeCAD</span>
                    </div>
                    <div class="status-item">
                        <div class="status-dot" id="aiStatus"></div>
                        <span>AI</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message system">
                    欢迎使用 FreeCAD AI 助手！请输入自然语言指令来控制 FreeCAD。
                    <br>例如："创建一个红色的立方体"、"添加一个圆柱体"、"查看场景"
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="输入指令..." 
                           onkeypress="if(event.key==='Enter') sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickSend('创建一个红色的立方体')">红色立方体</button>
                    <button class="quick-btn" onclick="quickSend('创建一个蓝色的圆柱体')">蓝色圆柱体</button>
                    <button class="quick-btn" onclick="quickSend('创建一个球体')">球体</button>
                    <button class="quick-btn" onclick="quickSend('查看场景')">查看场景</button>
                    <button class="quick-btn" onclick="quickSend('删除所有对象')">清空场景</button>
                    <button class="quick-btn" onclick="quickSend('获取截图')">截图</button>
                </div>
            </div>
        </div>
        
        <!-- 右侧预览面板 -->
        <div class="preview-panel">
            <div class="preview-header">
                <h2>3D 预览</h2>
                <div class="preview-actions">
                    <button class="preview-btn" onclick="refreshScreenshot()">刷新</button>
                    <button class="preview-btn" onclick="changeView('Front')">前视图</button>
                    <button class="preview-btn" onclick="changeView('Top')">俯视图</button>
                    <button class="preview-btn" onclick="changeView('Isometric')">等轴测</button>
                    <div class="export-controls">
                        <select class="export-select" id="exportFormat">
                            <option value="step">STEP (.step)</option>
                            <option value="stl">STL (.stl)</option>
                            <option value="obj">OBJ (.obj)</option>
                            <option value="iges">IGES (.iges)</option>
                            <option value="brep">BREP (.brep)</option>
                            <option value="csv">CSV (.csv)</option>
                        </select>
                        <button class="export-btn" id="exportBtn" onclick="exportModel()">导出</button>
                    </div>
                </div>
            </div>
            
            <div class="preview-content">
                <div class="model-viewer-container" id="modelViewer">
                    <div class="viewer-placeholder" id="viewerPlaceholder">等待 FreeCAD 连接...</div>
                    <canvas id="threeCanvas"></canvas>
                    <div class="viewer-controls" id="viewerControls">
                        <button class="viewer-btn" onclick="toggleWireframe()">线框</button>
                        <button class="viewer-btn" onclick="resetView()">重置视角</button>
                    </div>
                </div>
                
                <div class="scene-info">
                    <h3>场景信息</h3>
                    <div class="object-list" id="objectList">
                        暂无对象
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket 连接
        let ws = null;
        let currentView = 'Isometric';
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        let stopAutoReconnect = false;
        let reconnectTimer = null;
        let isScreenshotLoading = false;
        
        // 停止自动重连（供用户手动触发或页面卸载时调用）
        function stopReconnecting() {
            stopAutoReconnect = true;
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (ws) {
                try { ws.close(1000, '用户停止重连'); } catch (e) {}
            }
            console.log('[INFO] 已停止自动重连');
        }
        
        // 页面卸载时停止重连，避免后台继续尝试
        window.addEventListener('beforeunload', stopReconnecting);
        
        // 连接 WebSocket
        function connect() {
            if (stopAutoReconnect) return;
            
            // 构建 WebSocket URL
            let wsUrl;
            
            if (window.location.protocol === 'file:') {
                // 本地文件打开，使用默认地址
                wsUrl = 'ws://localhost:8001/ws';
                console.log('[INFO] 本地文件模式，使用默认 WebSocket 地址:', wsUrl);
            } else {
                // 通过服务器访问
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                wsUrl = protocol + '//' + window.location.host + '/ws';
                console.log('[INFO] 服务器模式，WebSocket 地址:', wsUrl);
            }
            
            console.log('尝试连接 WebSocket...');
            
            if (ws) {
                try {
                    ws.close();
                } catch (e) {
                    // 忽略关闭错误
                }
            }
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                reconnectAttempts = 0;
                console.log('[OK] WebSocket 已连接');
                updateStatus('wsStatus', true, '已连接');
                addMessage('system', '已连接到服务器');
                
                // 获取场景信息
                getSceneInfo();
                
                // 连接成功后自动加载 3D 模型
                setTimeout(() => refreshModel(), 1000);
            };
            
            ws.onclose = (event) => {
                console.log('[WARN] WebSocket 已断开 (code: ' + event.code + ', reason: ' + (event.reason || '无') + ')');
                updateStatus('wsStatus', false, '断开(' + event.code + ')');
                
                // 正常关闭或用户停止则不重连
                if (event.code === 1000 || stopAutoReconnect) return;
                
                reconnectAttempts++;
                if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
                    addMessage('system', '已达到最大重连次数，已停止自动重连。如需恢复请刷新页面。');
                    return;
                }
                
                // 只在第一次断开时提示，避免刷屏覆盖聊天记录
                if (reconnectAttempts === 1) {
                    addMessage('system', '连接已断开，正在尝试自动恢复...');
                }
                reconnectTimer = setTimeout(connect, 5000);
            };
            
            ws.onerror = (error) => {
                console.error('[ERROR] WebSocket 连接失败:', error);
                updateStatus('wsStatus', false, '错误');
                // 重连逻辑统一在 onclose 中处理，避免双重触发
            };
            
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    console.error('[ERROR] 解析消息失败:', e, event.data);
                }
            };
        }
        
        // 处理消息
        function handleMessage(msg) {
            console.log('收到消息:', msg);
            
            switch(msg.type) {
                case 'status':
                    addMessage('system', msg.content);
                    break;
                    
                case 'response':
                    addMessage('ai', msg.content);
                    // 先生成代码块，再显示执行输出
                    if (msg.code) {
                        addCodeBlock(msg.code);
                    }
                    if (msg.output) {
                        addOutput(msg.output);
                    }
                    break;
                    
                case 'code':
                    addCodeBlock(msg.content);
                    break;
                    
                case 'code_executed':
                    addMessage('system', msg.content + (msg.output ? '\n输出: ' + msg.output.substring(0, 200) : ''));
                    break;
                    
                case 'object_created':
                    addMessage('system', msg.content);
                    getSceneInfo();
                    // 对象创建后自动刷新 3D 模型
                    setTimeout(() => refreshModel(), 500);
                    break;
                    
                case 'export':
                    handleExportResponse(msg);
                    break;
                    
                case 'stl_exported':
                    // 加载 STL 到 3D 查看器
                    if (msg.content) {
                        loadSTLFromBase64(msg.content);
                    }
                    break;
                    
                case 'screenshot':
                    // 截图功能已替换为 3D 查看器，忽略截图消息
                    break;
                    
                case 'scene_info':
                    updateSceneInfo(msg.content);
                    break;
                    
                case 'error':
                    setModelLoading(false);
                    addMessage('error', msg.content);
                    break;
                    
                default:
                    console.log('未知消息类型:', msg.type);
            }
        }
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('error', '未连接到服务器');
                return;
            }
            
            addMessage('user', message);
            input.value = '';
            
            // 检查是否是特殊命令
            if (message.includes('截图') || message.includes('screenshot')) {
                ws.send(JSON.stringify({type: 'get_screenshot', view_name: currentView}));
                return;
            }
            
            if (message.includes('场景') || message.includes('对象') || message.includes('查看')) {
                ws.send(JSON.stringify({type: 'get_scene'}));
                return;
            }
            
            // 发送 AI 聊天消息
            ws.send(JSON.stringify({
                type: 'chat',
                content: message
            }));
        }
        
        // 快速发送
        function quickSend(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }
        
        // 获取场景信息
        function getSceneInfo() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type: 'get_scene'}));
            }
        }
        
        // 导出模型
        function exportModel() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('error', '未连接到服务器，无法导出');
                return;
            }
            
            const format = document.getElementById('exportFormat').value;
            const exportBtn = document.getElementById('exportBtn');
            
            exportBtn.disabled = true;
            exportBtn.textContent = '导出中...';
            
            // 发送导出请求
            ws.send(JSON.stringify({
                type: 'export',
                format: format
            }));
            
            addMessage('system', `正在导出为 ${format.toUpperCase()} 格式...`);
        }
        
        // 处理导出响应
        function handleExportResponse(msg) {
            const exportBtn = document.getElementById('exportBtn');
            exportBtn.disabled = false;
            exportBtn.textContent = '导出';
            
            if (msg.success) {
                if (msg.content && msg.is_base64) {
                    // 二进制文件：base64 解码后下载
                    const byteCharacters = atob(msg.content);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: msg.mime_type || 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = msg.filename || `export.${msg.format}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    addMessage('system', `[OK] 导出成功: ${msg.filename}`);
                } else if (msg.content) {
                    // 文本文件（如 CSV）：直接下载
                    const blob = new Blob([msg.content], { type: msg.mime_type || 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = msg.filename || `export.${msg.format}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    
                    addMessage('system', `[OK] 导出成功: ${msg.filename}`);
                }
            } else {
                addMessage('error', `[FAIL] 导出失败: ${msg.error || '未知错误'}`);
            }
        }
        
        // 设置截图加载状态（禁用按钮、显示/隐藏加载动画）
        function setScreenshotLoading(loading) {
            isScreenshotLoading = loading;
            
            // 禁用/启用预览按钮
            const buttons = document.querySelectorAll('.preview-btn, .export-btn');
            buttons.forEach(btn => {
                if (loading) {
                    btn.disabled = true;
                    btn.style.opacity = '0.6';
                    btn.style.cursor = 'not-allowed';
                } else {
                    btn.disabled = false;
                    btn.style.opacity = '';
                    btn.style.cursor = '';
                }
            });
            
            // 显示/隐藏截图区加载动画
            const container = document.getElementById('screenshotContainer');
            if (!container) return;
            let loadingDiv = document.getElementById('screenshotLoading');
            
            if (loading) {
                if (!loadingDiv) {
                    loadingDiv = document.createElement('div');
                    loadingDiv.id = 'screenshotLoading';
                    loadingDiv.className = 'screenshot-loading';
                    loadingDiv.innerHTML = '<div class="loading"></div><p>正在生成截图...</p>';
                    container.appendChild(loadingDiv);
                }
                loadingDiv.style.display = 'flex';
            } else if (loadingDiv) {
                loadingDiv.style.display = 'none';
            }
        }
        
        // 刷新截图（已替换为刷新 3D 模型）
        function refreshScreenshot() {
            refreshModel();
        }
        
        // 刷新 3D 模型
        function refreshModel() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('error', '未连接到服务器，无法刷新模型');
                return;
            }
            
            setModelLoading(true);
            ws.send(JSON.stringify({type: 'export_stl'}));
            addMessage('system', '正在加载 3D 模型...');
        }
        
        // 切换视图（已改为刷新 3D 模型）
        function changeView(view) {
            currentView = view;
            refreshModel();
        }
        
        // 设置模型加载状态
        function setModelLoading(loading) {
            const container = document.getElementById('modelViewer');
            let loadingDiv = document.getElementById('modelLoading');
            
            if (loading) {
                if (!loadingDiv) {
                    loadingDiv = document.createElement('div');
                    loadingDiv.id = 'modelLoading';
                    loadingDiv.className = 'viewer-loading';
                    loadingDiv.innerHTML = '<div class="loading"></div><p>正在加载 3D 模型...</p>';
                    container.appendChild(loadingDiv);
                }
                loadingDiv.style.display = 'flex';
            } else if (loadingDiv) {
                loadingDiv.style.display = 'none';
            }
        }
        
        // 更新截图（已废弃，保留兼容性）
        function updateScreenshot(base64Data) {
            console.log('截图功能已替换为 3D 查看器');
        }
        
        // 添加消息到聊天区
        function addMessage(type, content) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            let header = '';
            if (type === 'user') header = '<div class="message-header">你</div>';
            else if (type === 'ai') header = '<div class="message-header">AI 助手</div>';
            
            div.innerHTML = header + escapeHtml(content).replace(/\n/g, '<br>');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // 添加代码块
        function addCodeBlock(code) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ai';
            div.innerHTML = `
                <div class="message-header">生成的代码</div>
                <div class="code-block">
                    <pre>${escapeHtml(code)}</pre>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // 添加输出信息
        function addOutput(output) {
            if (!output || output.trim() === '') return;
            
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `
                <div class="message-header">执行输出</div>
                <div style="color: #00ff88; font-family: monospace; font-size: 0.9em; margin-top: 5px;">
                    ${escapeHtml(output).replace(/\n/g, '<br>')}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        // 更新截图
        function updateScreenshot(base64Data) {
            const container = document.getElementById('screenshotContainer');
            container.innerHTML = `<img src="data:image/png;base64,${base64Data}" alt="FreeCAD 预览">`;
        }
        
        // 更新场景信息
        function updateSceneInfo(info) {
            const list = document.getElementById('objectList');
            
            if (!info || !info.documents) {
                list.innerHTML = '暂无对象';
                return;
            }
            
            let html = '';
            const docs = info.doc_list || [];
            
            docs.forEach(docInfo => {
                // 支持新的格式: {name: "内部名", label: "显示名"}
                const docLabel = docInfo.label || docInfo;
                const docName = docInfo.name || docInfo;
                
                html += `<div style="color: #00d4ff; margin: 8px 0 4px 0;">文档: ${docLabel}`;
                if (docLabel !== docName) {
                    html += ` <span style="color: #666; font-size: 0.8em;">(${docName})</span>`;
                }
                html += `</div>`;
                
                const objects = info.documents[docLabel] || [];
                
                if (objects.length === 0) {
                    html += '<div style="padding-left: 15px; color: #666;">无对象</div>';
                } else {
                    objects.forEach(obj => {
                        // 优先显示 Label（用户修改的名称），如果没有则显示 Name
                        const label = obj.Label || obj.label || '';
                        const name = obj.Name || obj.name || 'Unknown';
                        const type = obj.TypeId || obj.type || 'Unknown';
                        
                        // 显示 Label 和 Name，如果不同则都显示
                        let displayName = label || name;
                        if (label && label !== name) {
                            displayName = `${label} <span style="color: #666; font-size: 0.8em;">(${name})</span>`;
                        }
                        
                        html += `
                            <div class="object-item" style="padding-left: 15px;">
                                <span>${displayName}</span>
                                <span style="color: #888;">${type}</span>
                            </div>
                        `;
                    });
                }
            });
            
            list.innerHTML = html || '暂无对象';
        }
        
        // 更新状态指示器
        function updateStatus(id, connected, detail) {
            const dot = document.getElementById(id);
            if (dot) {
                dot.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
            }
            
            // 更新详细信息
            if (id === 'wsStatus' && detail) {
                const detailEl = document.getElementById('wsDetail');
                if (detailEl) {
                    detailEl.textContent = detail;
                }
            }
        }
        
        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
                // ===================================
        // Three.js 3D 查看器
        // ===================================
        
        let scene, camera, renderer, controls, currentMesh;
        let isWireframe = false;
        let currentSTLData = null;
        
        function init3DViewer() {
            const canvas = document.getElementById('threeCanvas');
            const container = document.getElementById('modelViewer');
            
            if (!canvas || !container) {
                console.error('找不到 3D 查看器容器');
                return;
            }
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            // 创建相机
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true,
                alpha: true
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            
            // 添加轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.zoomSpeed = 1.0;
            controls.minDistance = 0.1;
            controls.maxDistance = 500;
            
            // 添加灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 5, 5);
            scene.add(directionalLight1);
            
            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-5, 3, -5);
            scene.add(directionalLight2);
            
            // 添加坐标轴
            const axesHelper = new THREE.AxesHelper(3);
            scene.add(axesHelper);
            
            // 窗口大小改变时调整
            window.addEventListener('resize', onWindowResize, false);
            
            // 启动渲染循环
            animate();
            
            console.log('3D 查看器初始化完成');
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function onWindowResize() {
            const container = document.getElementById('modelViewer');
            if (!container) return;
            
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            if (camera) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }
            
            if (renderer) {
                renderer.setSize(width, height);
            }
        }
        
        function loadSTLFromBase64(base64Data) {
            console.log('加载 STL 数据...');
            
            setModelLoading(true);
            
            try {
                // 隐藏占位符
                const placeholder = document.getElementById('viewerPlaceholder');
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
                
                // 显示控制栏
                const viewerControls = document.getElementById('viewerControls');
                if (viewerControls) {
                    viewerControls.style.display = 'flex';
                }
                
                // 解码 Base64
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                // 使用 STLLoader 加载
                const loader = new THREE.STLLoader();
                let geometry = loader.parse(bytes.buffer);
                
                // 重要：修复坐标轴对齐问题
                // FreeCAD 使用 Z 轴向上，Three.js 使用 Y 轴向上
                geometry.rotateX(-Math.PI / 2);
                
                // 重新计算几何体
                geometry.computeBoundingBox();
                
                // 移除旧模型
                if (currentMesh) {
                    scene.remove(currentMesh);
                    currentMesh.geometry.dispose();
                    currentMesh.material.dispose();
                }
                
                // 创建材质（橙色金属效果）
                const material = new THREE.MeshPhongMaterial({
                    color: 0xff8c42,
                    specular: 0x444444,
                    shininess: 100,
                    flatShading: false,
                    side: THREE.DoubleSide,
                    wireframe: isWireframe
                });
                
                // 创建网格
                currentMesh = new THREE.Mesh(geometry, material);
                
                // 居中模型
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                currentMesh.position.sub(center);
                
                // 添加到场景
                scene.add(currentMesh);
                
                // 自动调整相机位置
                const modelSize = new THREE.Vector3();
                geometry.boundingBox.getSize(modelSize);
                const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ *= 2.5;
                
                camera.position.set(cameraZ, cameraZ * 0.8, cameraZ);
                camera.lookAt(0, 0, 0);
                
                if (controls && typeof controls.update === 'function') {
                    controls.update();
                }
                
                // 保存 STL 数据
                currentSTLData = base64Data;
                
                setModelLoading(false);
                
                console.log('STL 模型加载成功');
                console.log('  顶点数:', geometry.attributes.position.count);
                console.log('  尺寸:', modelSize.x.toFixed(2), 'x', modelSize.y.toFixed(2), 'x', modelSize.z.toFixed(2));
                
            } catch (error) {
                console.error('STL 加载失败:', error);
                setModelLoading(false);
                addMessage('error', '3D 模型加载失败: ' + error.message);
            }
        }
        
        function toggleWireframe() {
            if (currentMesh) {
                isWireframe = !isWireframe;
                currentMesh.material.wireframe = isWireframe;
            }
        }
        
        function resetView() {
            if (currentMesh) {
                const geometry = currentMesh.geometry;
                geometry.computeBoundingBox();
                const modelSize = new THREE.Vector3();
                geometry.boundingBox.getSize(modelSize);
                const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ *= 2.5;
                
                camera.position.set(cameraZ, cameraZ * 0.8, cameraZ);
                camera.lookAt(0, 0, 0);
                controls.reset();
            }
        }
        
        // 初始化 3D 查看器
        init3DViewer();
        
        // 连接 WebSocket
        connect();
        
        // 检查 FreeCAD 和 AI 状态
        fetch('/health')
            .then(r => r.json())
            .then(data => {
                updateStatus('fcStatus', data.freecad_connected);
            })
            .catch(() => updateStatus('fcStatus', false));
        
        fetch('/api/ai/status')
            .then(r => r.json())
            .then(data => {
                updateStatus('aiStatus', data.enabled);
            })
            .catch(() => updateStatus('aiStatus', false));
    </script>
